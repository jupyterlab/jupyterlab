version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: latest
    nodejs: latest
  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install --group 'docs'
      # asdf's shims predate the pip install above, so the console scripts it
      # creates (jlpm, jupyter, jupyter-book, ...) are not on PATH; add the
      # environment scripts dir so they resolve in the later build steps.
      - export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
    post_install:
      # this should have already run, but show some errors/warnings more cleanly
      - jlpm
      # again ensure all packages are built
      - jlpm build:packages
      # avoid the lengthy `typedoc` build inside `sphinx` for cleaner logs
      - jlpm docs
    build:
      html:
        # Build the site
        - cd docs/ && export BASE_URL="/en/$READTHEDOCS_VERSION" && make html
    post_build:
        # Copy generated files into Read the Docs directory
        - mkdir --parents $READTHEDOCS_OUTPUT/html/
        - cp --recursive docs/_build/site/* $READTHEDOCS_OUTPUT/html/
