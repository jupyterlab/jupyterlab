function makeCombo(sel) {
  sel.classList.add('cb-native');
  sel.tabIndex = -1;
  const wrap = document.createElement('div');
  wrap.className = 'cb';
  sel.parentNode.insertBefore(wrap, sel);

  inp.setAttribute('role', 'combobox');
  const list = document.createElement('div');
  list.className = 'cb-list'; list.hidden = true;
  wrap.append(inp, list);
  const first = sel.options[0];

  const label = () => { const o = sel.selectedOptions[0]; return o && o.value !== '' ? o.textContent : ''; };
  inp.value = label();
  let items = [], active = -1;
  const paint = () => {
    $$('.cb-opt', list).forEach((el, i) => el.classList.toggle('active', i === active));
    const a = list.children[active];
    if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
  };
  const render = q => {
    const nq = norm(q).trim();
    items = Array.from(sel.options).filter(o => !nq || norm(o.textContent + ' ' + o.value).indexOf(nq) > -1).slice(0, 300);
    active = nq ? (items.length ? 0 : -1) : items.findIndex(o => o.value === sel.value);
    list.innerHTML = items.length
      ? items.map((o, i) => `<div class="cb-opt ${o.value === '' ? 'cb-blank' : ''}" data-i="${i}">${optHtml(o)}</div>`).join('')
      : `<div class="cb-none">${t('noResults')}</div>`;
    paint();
  };
  const open = () => { if (sel.disabled || !list.hidden) return; render(''); list.hidden = false; wrap.classList.add('open'); inp.select(); };
  const close = () => { list.hidden = true; wrap.classList.remove('open'); inp.value = label(); };
  const pick = o => {
    if (o && sel.value !== o.value) { sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles: true })); }
    close();
  };
  inp.addEventListener('focus', open);
  inp.addEventListener('click', open);
  inp.addEventListener('input', () => { list.hidden = false; wrap.classList.add('open'); render(inp.value); });
  inp.addEventListener('keydown', e => {

}

function groupDigits(raw) {
  let v = String(raw).replace(/[^\d.\-]/g, '');
  const neg = v.charAt(0) === '-';
  v = v.replace(/-/g, '');
  const dot = v.indexOf('.');
  let int = dot > -1 ? v.slice(0, dot) : v;
  const dec = dot > -1 ? '.' + v.slice(dot + 1).replace(/\./g, '') : '';
  int = int.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + int + dec;
}
function formatNumInput(el) {
  const caret = el.selectionStart == null ? el.value.length : el.selectionStart;
  const keep = el.value.slice(0, caret).replace(/[^\d.\-]/g, '').length;
  el.value = groupDigits(el.value);
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < keep) { if (/[\d.\-]/.test(el.value[pos])) seen++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}

/** Shrinks an uploaded image so the data URL fits in one Google Sheets cell (< 48 KB). */
function logoDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('LOGO_INVALID'));
      img.onload = () => {
        let w = img.naturalWidth || 400, h = img.naturalHeight || 160;
        const k = Math.min(1, 400 / w, 160 / h);
        w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        for (let step = 0; step < 6; step++) {
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          let url = c.toDataURL('image/png');
          if (url.length > 48000) url = c.toDataURL('image/webp', .85);
          if (url.length > 48000) url = c.toDataURL('image/jpeg', .85);
          if (url.length <= 48000) return resolve(url);
          w = Math.round(w * .75); h = Math.round(h * .75);
        }
        reject(new Error('LOGO_INVALID'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const collectorOpts = () => S.lookups.collectors.map(c => [c.username, c.name]);
const statusOpts = () => ['Active', 'Inactive', 'Blocked'].map(s => [s, t(s)]);
const customerOpts = () => S.lookups.customers.map(c => [c.account, c.account + ' — ' + c.name, c.account, c.name]);
const currencyOpts = extra => {
  const list = S.lookups.currencies.map(c => [c.code, c.code + (c.name ? ' — ' + c.name : ''), c.code, c.name || '']);
  [baseCur(), localCur()].concat(extra || []).forEach(c => { if (c && !list.some(x => x[0] === c)) list.push([c, c, c, '']); });
  return list;
};

function tool(key, label, type, value, options, noAll) {
  let input;
  if (type === 'select') input = `<select data-f="${key}">${opts(options, value, !noAll)}</select>`;
  else if (type === 'customer') input = `<select data-f="${key}">${opts(customerOpts(), value, true)}</select>`;
  else if (type === 'check') return `<label class="check" style="flex:0 0 auto"><input type="checkbox" data-f="${key}" ${value ? 'checked' : ''}>${label}</label>`;
  else input = `<input data-f="${key}" type="${type || 'text'}" value="${esc(value)}" ${type === 'search' ? `placeholder="${t('typeToSearch')}"` : ''}>`;
  return `<label class="tool">${esc(label)}${input}</label>`;
}
const curTool = f => tool('currency', t('displayCurrency'), 'select', f.currency || baseCur(), currencyOpts(), true);
function readTools(el) {
  const o = {};
  $$('[data-f]', el).forEach(i => { o[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
  return o;
}
function missingNotice(r) {
  if (!r) return '';
  return dupNotice(r.dupCustomers) + (!r.missingRates || !r.missingRates.length ? '' :
    `<div class="panel notice">⚠ ${t('missingRates')}: <b>${r.missingRates.map(esc).join('، ')}</b>
    ${hasPage('currencies') ? `<button class="section-action" data-go="currencies">${t('p_currencies')} ←</button>` : ''}</div>`);
}
/** Repeated vendor rows in the sheet (merged automatically) → offer the cleanup. */
function dupNotice(n) {
  if (!n) return '';
  return `<div class="panel notice">⚠ ${t('dupFound', { n: NI.format(n) })}
    ${S.user.isAdmin && hasPage('import') ? btn('cleanDup', '🧹 ' + t('cleanDup'), 'button-ghost') : `<span>${t('askAdmin')}</span>`}</div>`;
}

/**
 * cols: [{k, l, f(value,row) → html, num, cls, x(row) → export value}]
 * opts: { click, actions(row,i) → html, foot: html, select(row) → bool, sortable }
 */
function table(view, cols, rows, o) {
  o = o || {};
  S.rows[view] = rows;
  if (!rows.length) return `<div class="empty">${t('noData')}</div>`;
  const st = S.lists[view];
  const sortable = !!(st && o.sortable !== false);
  const th = cols.map(c => {
    const arrow = sortable && st.sort === c.k ? (st.desc ? ' ↓' : ' ↑') : '';
    return `<th class="${c.num ? 'num' : ''} ${sortable && c.k ? 'sortable' : ''}" ${sortable && c.k ? `data-sort="${c.k}"` : ''}>${esc(c.l)}${arrow}</th>`;
  }).join('');
  const body = rows.map((r, i) => `<tr data-i="${i}" class="${o.click ? 'click' : ''}">` +
    (o.select ? `<td class="actions-cell" data-label="">${o.select(r) ? `<label class="check"><input type="checkbox" data-sel="${esc(r.rowId)}"></label>` : ''}</td>` : '') +
    cols.map(c => {
      const v = r[c.k];
      const html = c.f ? c.f(v, r) : c.num ? numCell(v) : bdi(v);
      const title = c.cls === 'clip' ? ` title="${esc(v)}"` : '';
      return `<td data-label="${esc(c.l)}" class="${c.num ? 'num' : ''} ${c.cls || ''}"${title}>${html}</td>`;
    }).join('') +
    (o.actions ? `<td class="actions-cell" data-label=""><div class="row-actions">${o.actions(r, i)}</div></td>` : '') +
    '</tr>').join('');
  return `<div class="table-wrap"><table class="cards" data-view="${view}"><thead><tr>${o.select ? '<th></th>' : ''}${th}${o.actions ? '<th></th>' : ''}</tr></thead>
    <tbody>${body}</tbody>${o.foot ? `<tfoot>${o.foot}</tfoot>` : ''}</table></div>`;
}

/** Totals row. totals[k] = number, or {html} for custom content. */
function footRow(cols, totals, label, lead, tail) {
  return '<tr>' + (lead ? '<td data-label=""></td>' : '') + cols.map((c, i) => {
    const v = totals[c.k];
    const html = i === 0 ? esc(label) : v === undefined ? '' : (v && v.html) ? v.html : numCell(v);
    return `<td data-label="${esc(c.l)}" class="${c.num ? 'num' : ''}">${html}</td>`;
  }).join('') + (tail ? '<td></td>' : '') + '</tr>';
}

function pager(view, res) {
  const pages = Math.max(1, Math.ceil(res.total / res.pageSize));
  return `<div class="pager" data-view="${view}"><span>${NI.format(res.total)} ${t('rowsWord')} · ${t('page')} ${res.page} ${t('of')} ${pages}</span>
    <div class="pager-btns">
      <select data-pagesize data-plain>${opts([[25, '25'], [50, '50'], [100, '100'], [250, '250']], res.pageSize)}</select>
      <button class="button-ghost" data-act="page" data-p="${res.page - 1}" ${res.page <= 1 ? 'disabled' : ''}>${t('prev')}</button>
      <button class="button-ghost" data-act="page" data-p="${res.page + 1}" ${res.page >= pages ? 'disabled' : ''}>${t('next')}</button>
    </div></div>`;
}

function stat(label, value, mark, markCls, foot) {
  return `<article class="panel stat"><div class="stat-top"><div><div class="stat-label">${esc(label)}</div><div class="stat-value">${value}</div></div>
    <div class="stat-mark ${markCls || ''}">${mark}</div></div>${foot ? `<div class="stat-foot">${foot}</div>` : ''}</article>`;
}

function permSummary(r) {
  if (r.role === 'Admin') return t('all');
  let pm = null;
  try { pm = r.perms ? JSON.parse(r.perms) : null; } catch (e) { pm = null; }
  if (!pm) return ['Add', 'Edit', 'Delete', 'Post'].filter(a => r['can' + a]).map(a => t('f_can' + a)).join(' · ');
  return Object.keys(pm).map(pg => t('p_' + pg) + ': ' + pm[pg].map(a => t('perm_' + a)).join('/')).join(' · ') || '—';
}

function listState(view) {
  return S.lists[view] = S.lists[view] || { q: '', voucher: '', filters: {}, page: 1, pageSize: 25, sort: '', desc: undefined, dateFrom: '', dateTo: '' };
}

function listBlock(view) {
  const cfg = LISTS[view], s = listState(view);
  return `<div class="panel view-tools" data-list="${view}">${cfg.tools(s).join('')}</div>
    <section class="panel section" style="margin-top:0"><div id="list_${view}"><div class="skeleton">${t('loading')}</div></div></section>`;
}

async function loadList(view) {
  const cfg = LISTS[view], s = listState(view);
  const query = { q: s.q, voucher: s.voucher, filters: s.filters, page: s.page, pageSize: s.pageSize, sort: s.sort, desc: s.desc, dateFrom: s.dateFrom, dateTo: s.dateTo, receipts: !!cfg.receipts };
  const res = await call('listRecords', cfg.entity, query);
  s.page = res.page;
  const cols = cfg.cols();
  const sel = can('post') ? cfg.select : null;
  let foot = '';
  if (view === 'purchases' && res.rows.length) {
    foot = footRow(cols, { total: { html: numCell(res.totals.total) + curTag(res.totals.localCurrency) } }, t('all') + ' (' + NI.format(res.total) + ')', false, true);
  }
  if (view === 'transactions' && res.rows.length) {
    const lc = res.totals.localCurrency;
    foot = footRow(cols, {
      debitMST: { html: numCell(res.totals.debit) + curTag(lc) }, creditMST: { html: numCell(res.totals.credit) + curTag(lc) },
      balance: { html: `<small class="cur">${t('net')}</small> ${numCell(res.totals.net)}` }
    }, t('all') + ' (' + NI.format(res.total) + ')', !!sel, !!cfg.actions);
  }
  const el = $('#list_' + view);
  if (!el) return;
  el.innerHTML = table(view, cols, res.rows, { click: !!cfg.click, actions: cfg.actions, select: sel, foot: foot }) + pager(view, res);
  const exp = S.exportData = { name: view, cols: cols, rows: res.rows,
    fetchAll: async () => (await call('listRecords', cfg.entity, Object.assign({}, query, { all: true }))).rows };
  if (cfg.entity === 'Transactions') exp.totals = { debitMST: res.totals.debit, creditMST: res.totals.credit };
  if (view === 'receipts' && res.totals.byMethod) {
    const bm = res.totals.byMethod, lc = res.totals.localCurrency;
    exp.summary = [['Cash', 'Cash'], ['Cheque', 'Cheque'], ['Transfer', 'Transfer'], ['Other', 'OtherMethod']].map(x => [t(x[1]), money(bm[x[0]]) + ' ' + lc]);
    const box = $('#recStats');
    if (box) box.innerHTML = stat(t('Cash'), money(bm.Cash) + curTag(lc), '¤', 'green') + stat(t('Cheque'), money(bm.Cheque) + curTag(lc), '✎', 'amber') +
      stat(t('Transfer'), money(bm.Transfer) + curTag(lc), '⇄', '') + stat(t('OtherMethod'), money(bm.Other) + curTag(lc), '…', '');
  }
}

function onListTools(view, el) {
  const s = listState(view), v = readTools(el);
  s.q = v.q || ''; s.voucher = v.voucher || ''; s.dateFrom = v.dateFrom || ''; s.dateTo = v.dateTo || '';
  s.filters = {};
  Object.keys(v).forEach(k => { if (['q', 'voucher', 'dateFrom', 'dateTo'].indexOf(k) === -1) s.filters[k] = v[k]; });
  s.page = 1;
  loadList(view);
}

function fieldHtml(f, rec, isNew) {
  const v = rec[f.k] == null ? '' : rec[f.k];
  const label = t(f.label || ('f_' + f.k)) + (f.req ? ' <span class="req">*</span>' : '');
  const req = f.req ? 'required' : '';
  const cls = 'field' + (f.span ? ' span2' : '');
  const hint = f.hint ? `<span class="field-hint" data-hint="${f.k}">${esc(f.hint)}</span>` : '';
  switch (f.type) {
    case 'select': {
      const o = f.o.slice();
      if (v !== '' && !o.some(x => String(x[0]) === String(v))) o.push([v, v]);
      return `<label class="${cls}">${label}<select name="${f.k}" ${req}>${f.noAll ? '' : '<option value=""></option>'}${opts(o, v)}</select>${hint}</label>`;
    }
    case 'textarea': return `<label class="${cls}">${label}<textarea name="${f.k}" ${req}>${esc(v)}</textarea>${hint}</label>`;
    case 'customer': return `<label class="${cls}">${label}<select name="${f.k}" ${req}><option value=""></option>${opts(customerOpts(), v)}</select>${hint}</label>`;
    case 'number': return `<label class="${cls}">${label}<input name="${f.k}" type="text" inputmode="decimal" data-num value="${esc(fmtInputNum(v))}" ${req}>${hint}</label>`;
    case 'check': return `<label class="check" style="align-self:end;min-height:34px"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}>${t('f_' + f.k)}</label>`;
    case 'flags': return `<div class="${cls}">${label}<div class="check-grid">${['canAdd', 'canEdit', 'canDelete', 'canPost'].map(k =>
      `<label class="check"><input type="checkbox" name="${k}" ${rec[k] ? 'checked' : ''}>${t('f_' + k)}</label>`).join('')}</div></div>`;
    case 'perm': { // page × (view, add, edit, delete, post)
      const view = String(rec.pages || '').split(',').map(x => x.trim());
      let pm = null;
      try { pm = rec.perms ? JSON.parse(rec.perms) : null; } catch (e) { pm = null; }
      const has = (pg, a) => pm ? !!(pm[pg] && pm[pg].indexOf(a) > -1) : view.indexOf(pg) > -1 && !!rec['can' + a[0].toUpperCase() + a.slice(1)];
      const cols = ['view'].concat(ACTIONS);
      return `<div class="${cls}">${t('permTitle')}<div class="table-wrap perm-wrap"><table class="perm"><thead><tr><th>${t('pageCol')}</th>${cols.map(c =>
        `<th><label class="check"><input type="checkbox" data-permcol="${c}">${t('perm_' + c)}</label></th>`).join('')}</tr></thead>
        <tbody>${PAGES.filter(p => p.id !== 'messages').map(p => `<tr data-pg="${p.id}"><td>${p.glyph} ${t('p_' + p.id)}</td>
          <td><input type="checkbox" name="v_${p.id}" data-perm="view" ${view.indexOf(p.id) > -1 ? 'checked' : ''}></td>
          ${ACTIONS.map(a => (PAGE_ACTS[p.id] || []).indexOf(a) > -1
            ? `<td><input type="checkbox" name="a_${p.id}_${a}" data-perm="${a}" ${has(p.id, a) ? 'checked' : ''}></td>` : '<td class="na">—</td>').join('')}</tr>`).join('')}</tbody></table></div>
        <span class="field-hint">${t('permHint')}</span></div>`;
    }
    case 'pages': {
      const sel = String(v || '').split(',');
      return `<div class="${cls}">${label}<div class="check-grid">${PAGES.filter(p => p.id !== 'messages').map(p =>
        `<label class="check"><input type="checkbox" name="page" value="${p.id}" ${sel.indexOf(p.id) > -1 ? 'checked' : ''}>${t('p_' + p.id)}</label>`).join('')}</div></div>`;
    }
    default: return `<label class="${cls}">${label}<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.lock && !isNew ? 'readonly' : ''} ${f.type === 'password' ? 'autocomplete="new-password"' : ''}>${hint}</label>`;
  }
}

function openForm(entity, rec, isNew) {
  rec = Object.assign({}, rec || {});
  FORM = { entity, rec, isNew };
  const fields = FORMS[entity]().filter(f => !f.hide);

  openDrawer(`

    </form>`, entity === 'Users');
}

/** Transaction form: amount × rate → debit/credit (negative = credit / vendor invoice), currency → exchange rate. */
function txFormCalc(form, changed) {
  const E = form.elements, set = (n, v) => { E[n].value = v === '' ? '' : groupDigits(String(Math.round(v * 100) / 100)); };
  if (changed === 'currency') {
    const r = rateOf(E.currency.value), l = rateOf(localCur());
    if (r && l) E.exchange.value = groupDigits(String(+(r / l).toFixed(6)));
    changed = 'amountCur';
  }
  const ex = parseNum(E.exchange.value) || 1;
  if (changed === 'amountCur' || changed === 'exchange') {
    const amt = parseNum(E.amountCur.value);
    if (!amt) return;
    const local = Math.abs(amt) * ex;
    if (amt < 0) { set('creditMST', local); set('debitMST', 0); } else { set('debitMST', local); set('creditMST', 0); }
  } else if (changed === 'debitMST' || changed === 'creditMST') {
    const d = parseNum(E.debitMST.value), c = parseNum(E.creditMST.value);
    if (d || c) set('amountCur', (d - c) / ex);
  }
}

async function submitForm(form) {
  const { entity, rec, isNew, fields } = FORM;
  const data = {};
  if (!isNew) data[ID_KEY[entity]] = rec[ID_KEY[entity]];
  fields.forEach(f => {
    if (f.type === 'flags') ['canAdd', 'canEdit', 'canDelete', 'canPost'].forEach(k => { data[k] = form.elements[k].checked; });
    else if (f.type === 'pages') data.pages = $$('input[name=page]:checked', form).map(i => i.value).join(',');
    else if (f.type === 'perm') {
      const perms = {}, pages = [];
      $$('tr[data-pg]', form).forEach(tr => {
        const pg = tr.dataset.pg;
        if ($('[data-perm=view]', tr).checked) pages.push(pg);
        const acts = $$('input[data-perm]:not([data-perm=view]):checked', tr).map(i => i.dataset.perm);
        if (acts.length) perms[pg] = acts;
      });
      data.pages = pages.join(','); data.perms = perms;
    }
    else if (f.type === 'check') data[f.k] = form.elements[f.k].checked;
    else if (f.type === 'number') data[f.k] = form.elements[f.k].value.trim() === '' ? '' : parseNum(form.elements[f.k].value);
    else data[f.k] = form.elements[f.k].value.trim();
  });
  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try {
    await call('saveRecord', entity, data, isNew);
    toast(t('saved'));
    closeDrawer();
    if (LOOKUP_ENTITIES.indexOf(entity) > -1) await refreshLookups();
    reload();
  } catch (e) { b.disabled = false; }
}

// Report runner — reads the tool bar, calls the matching server report, renders it.
async function runReport() {
  const view = S.view;
  const f = Object.assign(S.rep[view], readTools($('#repTools')));
  const out = () => $('#repOut');
  const collCol = { k: 'collector', l: t('f_collector'), f: v => bdi(collectorName(v)), x: r => collectorName(r.collector) };
  if (view === 'statement') {
    if (!f.account) { S.lastStmt = null; out().innerHTML = `<div class="panel empty">${t('chooseCustomer')}</div>`; return; }
    out().innerHTML = `<div class="skeleton">${t('loading')}</div>`;
    const r = await call('customerStatement', f.account, f.dateFrom, f.dateTo, f.currency);
    if (S.view !== view) return;
    S.lastStmt = r;
    const cc = r.currency;
    S.exportData = { name: stmtFileName(r), title: t('stmtTitle') + ' — ' + (r.customer || {}).name, rows: r.lines,
      cols: [{ k: 'date', l: t('f_date') }, { k: 'voucher', l: t('f_voucher') }, { k: 'type', l: t('f_type') }, { k: 'description', l: t('f_description') },
        { k: 'payMethod', l: t('f_payMethod'), x: x => x.payMethod ? t(x.payMethod) : '' }, { k: 'dueDate', l: t('f_dueDate') },
        { k: 'debit', l: t('debit') + ' ' + cc, num: true }, { k: 'credit', l: t('credit') + ' ' + cc, num: true }, { k: 'balance', l: t('balance') + ' ' + cc, num: true }] };
    out().innerHTML = missingNotice(r) + `<div class="paper"><div class="doc" dir="${document.documentElement.dir}">${statementDoc(r)}</div></div>`;
    return;
  }
  if (view === 'collections') {
    const r = await call('reportCollections', f);
    if (S.view !== view) return;
    const cc = r.currency;
    const userName = u => { if (!u) return t('unassigned'); const x = (S.lookups.users || []).find(y => y.username === u); return x ? x.name : u; };
    const colCols = [{ k: 'collector', l: t('f_collectedBy'), f: v => bdi(userName(v)), x: x => userName(x.collector) },
      { k: 'Cash', l: t('Cash'), num: true }, { k: 'Cheque', l: t('Cheque'), num: true }, { k: 'Transfer', l: t('Transfer'), num: true },
      { k: 'Other', l: t('OtherMethod'), num: true }, { k: 'total', l: t('totalCollected') + ' ' + cc, num: true },
      { k: 'count', l: t('receiptsCount'), num: true, f: v => NI.format(v) }, { k: 'customers', l: t('companiesN'), num: true, f: v => NI.format(v) }];

function groupCustomers(rows) {
  const m = {};
  rows.forEach(r => {
    const c = m[r.account] = m[r.account] || { account: r.account, name: r.name, collector: r.collector, phone: r.phone, count: 0, remaining: 0, maxDays: 0, lastFollowUp: r.lastFollowUp, promiseDate: r.promiseDate };
    c.count++; c.remaining += r.remaining; c.maxDays = Math.max(c.maxDays, r.days);
  });
  return Object.values(m).sort((a, b) => b.remaining - a.remaining);
}

/**
 * Reads the first sheet. Date cells are converted from their Excel serial numbers directly
 * (no browser time-zone shift, which used to move dates to the previous day 23:59).
 */
function readImportFile(file) {
  if (typeof XLSX === 'undefined') { toast(t('xlsxMissing'), 'error'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: false, cellNF: true, raw: /\.csv$/i.test(file.name) });
    const ws = wb.Sheets[wb.SheetNames[0]];
    Object.keys(ws).forEach(addr => {
      const c = ws[addr];
      if (addr[0] === '!' || !c || c.t !== 'n') return;
      const fmt = c.z || (c.XF && c.XF.numFmtId != null && XLSX.SSF._table ? XLSX.SSF._table[c.XF.numFmtId] : '');
      if (fmt && XLSX.SSF.is_date(fmt)) {
        const d = XLSX.SSF.parse_date_code(c.v);
        if (!d) return;
        const txt = d.y + '-' + z(d.m) + '-' + z(d.d) + (d.H || d.M ? ' ' + z(d.H) + ':' + z(d.M) : '');
        ws[addr] = { t: 's', v: txt, w: txt };
      }
    });
    IMP.rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true }).map(r => {
      const o = {};
      Object.keys(r).forEach(k => { o[String(k).trim()] = typeof r[k] === 'string' ? r[k].trim() : r[k]; });
      return o;
    }).filter(r => Object.values(r).some(v => v !== '' && v != null));
    $('#impResult').innerHTML = '';
    const heads = IMP.rows.length ? Object.keys(IMP.rows[0]) : [];
    IMP.preview = heads.length ? await call('previewImport', heads) : null;
    if (IMP.preview && IMP.preview.best && IMP.preview.best !== $('#impEntity').value) {
      setComboValue($('#impEntity'), IMP.preview.best);
      toast(t('imp_detected', { e: entityName(IMP.preview.best) }));
    }
    renderImportPreview();
  };
  reader.readAsArrayBuffer(file);
}
const entityName = e => t({ Vendors: 'p_customers', Transactions: 'p_transactions', VendorGroups: 'p_groups', Currencies: 'p_currencies',
  Items: 'p_items', ItemGroups: 'p_itemgroups', Warehouses: 'p_warehouses', Accounts: 'p_accounts' }[e]);
function setComboValue(sel, v) {
  sel.value = v;
  sel.dispatchEvent(new Event('change', { bubbles: true }));
}
function impOptions() {
  const e = $('#impEntity').value;
  IMP.entity = e;
  $('#impTxOpts').hidden = e !== 'Transactions';
  $('#impReplaceHint').hidden = !(e === 'Transactions' && $('#impMode').value === 'replace');
}
function renderImportPreview() {
  impOptions();
  const box = $('#impPreview'), note = $('#impNotice');
  if (!IMP.rows) { box.innerHTML = ''; note.innerHTML = ''; return; }
  const e = $('#impEntity').value;
  const pv = IMP.preview && IMP.preview.entities[e];
  const heads = IMP.rows.length ? Object.keys(IMP.rows[0]) : [];
  let warn = '';
  if (pv && !pv.hasId) warn = `<div class="panel notice danger">⛔ ${t('imp_noid', { f: IMP_KEY[e] })}</div>`;
  else if (IMP.preview && IMP.preview.best && IMP.preview.best !== e) warn = `<div class="panel notice danger">⚠ ${t('imp_mismatch', { b: entityName(IMP.preview.best), e: entityName(e) })}</div>`;
  note.innerHTML = warn;
  $('#impRun').disabled = !IMP.rows.length || (pv && !pv.hasId);
  const fieldLabel = f => I18N.en['f_' + f] ? t('f_' + f) : f === 'custName' ? t('f_name') : f;
  box.innerHTML = `<section class="panel section">
      <div class="section-head"><h2 class="section-title">${t('imp_map')}</h2><span class="badge blue">${t('rowsFound')}: ${NI.format(IMP.rows.length)}</span></div>
      <div class="map-grid">${(pv ? pv.pairs : heads.map(h => [h, ''])).map(p => `<div class="map-item ${p[1] ? 'ok' : 'off'}"><span>${esc(p[0])}</span><b>${p[1] ? '→ ' + esc(fieldLabel(p[1])) : t('imp_ignored')}</b></div>`).join('')}</div>
    </section>
    <section class="panel section">
      <div class="section-head"><h2 class="section-title">${t('previewTitle')}</h2></div>
      <div class="table-wrap"><table><thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${IMP.rows.slice(0, 5).map(r => '<tr>' + heads.map(h => `<td>${typeof r[h] === 'number' ? money(r[h]) : bdi(r[h])}</td>`).join('') + '</tr>').join('')}</tbody></table></div></section>`;
}

async function runImport() {
  const entity = $('#impEntity').value, mode = $('#impMode').value;
  if (!IMP.rows || !IMP.rows.length) return;
  if (IMP.preview && IMP.preview.best && IMP.preview.best !== entity && !confirm(t('imp_confirmWrong'))) return;
  if (mode === 'replace' && !confirm(t('replace') + ' — ' + t('confirmDelete') + (entity === 'Transactions' ? '\n' + t('imp_replaceTx') : ''))) return;
  const o = entity === 'Transactions'
    ? { sign: $('#impSign').value, dateOrder: $('#impDates').value, createCustomers: $('#impCreate').checked, skipDuplicates: $('#impSkip').checked }
    : { dateOrder: 'auto' };
  const b = $('#impRun'); b.disabled = true;
  const total = { inserted: 0, updated: 0, skipped: 0, duplicates: 0, createdCustomers: 0, unknownAccounts: 0 };
  const size = 2000;
  let done = false;
  try {
    for (let i = 0; i < IMP.rows.length; i += size) {
      b.textContent = `${t('importNow')} ${NI.format(Math.min(i + size, IMP.rows.length))}/${NI.format(IMP.rows.length)}`;
      const r = await call('importRows', entity, IMP.rows.slice(i, i + size), i === 0 ? mode : (mode === 'replace' ? 'append' : mode), o);
      Object.keys(total).forEach(k => { total[k] += r[k] || 0; });
    }
    done = true;
    toast(t('importedMsg', { i: NI.format(total.inserted), u: NI.format(total.updated), s: NI.format(total.skipped + total.duplicates) }));
    const row = (k, v, cls) => v ? `<div class="mini-stat ${cls || ''}"><span>${t(k)}</span><b>${NI.format(v)}</b></div>` : '';
    $('#impResult').innerHTML = `<section class="panel section imp-result"><div class="section-head"><h2 class="section-title">✓ ${t('imp_result')} — ${esc(entityName(entity))}</h2></div>
      <div class="mini-stats" style="padding:0 16px 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        ${row('imp_added', total.inserted, 'pos')}${row('imp_updated', total.updated)}${row('imp_dups', total.duplicates)}
        ${row('imp_noIdRows', total.skipped, 'neg')}${row('imp_newCust', total.createdCustomers)}${row('imp_unknown', total.unknownAccounts, 'neg')}
        ${!total.inserted && !total.updated ? `<div class="mini-stat"><span>${t('imp_added')}</span><b>0</b></div>` : ''}</div></section>`;
    await refreshLookups();
  } finally {
    b.textContent = t('importNow');
    if (done) { IMP.rows = null; $('#impFile').value = ''; } // prevents importing the same file twice by mistake
    b.disabled = !IMP.rows;
  }
}

// ───────── Export to Excel (.xlsx) ─────────
async function exportXlsx() {
  if (typeof XLSX === 'undefined') { toast(t('xlsxMissing'), 'error'); return; }
  const d = await fullExportData(100000);
  if (!d || !d.rows.length) { toast(t('noData'), 'error'); return; }
  const val = (c, r) => {
    const v = c.x ? c.x(r) : r[c.k];
    if (c.num) return v === '' || v == null ? '' : (+v || 0);
    return v == null ? '' : v;
  };
  const aoa = [d.cols.map(c => c.l)].concat(d.rows.map(r => d.cols.map(c => val(c, r))));
  if (d.totals) aoa.push(d.cols.map((c, i) => i === 0 ? t('all') : d.totals[c.k] !== undefined ? +d.totals[c.k] : ''));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const rows = aoa.length;
  d.cols.forEach((c, ci) => {
    if (!c.num && c.k !== 'pct') return;
    for (let r = 1; r < rows; r++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c: ci })];
      if (cell && cell.t === 'n') cell.z = c.k === 'pct' ? '0%' : c.k === 'rate' || c.k === 'exchange' || c.k === 'inverse' ? '#,##0.######' : '#,##0';
    }
  });
  ws['!cols'] = d.cols.map((c, ci) => ({ wch: Math.min(60, Math.max(10, ...aoa.slice(0, 500).map(row => String(row[ci] == null ? '' : row[ci]).length + 3))) }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: d.rows.length, c: d.cols.length - 1 } }) };
  const wb = XLSX.utils.book_new();
  if (S.lang === 'ar') wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, String(d.name).replace(/[\\\/?*\[\]:]/g, '_').slice(0, 31));
  XLSX.writeFile(wb, d.name + '_' + today() + '.xlsx');
}

function companyHeader(title, pairs) {

  return `<table class="hdr"><tr><td>${st.CompanyLogo ? `<img class="doc-logo" src="${esc(st.CompanyLogo)}" alt="">` : ''}<h1>${esc(st.CompanyName || st.AppName || t('app'))}</h1>

function printCell(c, r) {
  if (c.p) return c.p(r);
  const v = c.x ? c.x(r) : r[c.k];
  if (c.num) return v === '' || v == null ? '' : (['rate', 'exchange', 'inverse'].indexOf(c.k) > -1 ? NF6.format(+v || 0) : money(v));
  return v == null ? '' : v;
}
function printTableHtml(cols, rows, totals) {
  return `<table class="grid"><thead><tr>${cols.map(c => `<th class="${c.num ? 'n' : ''}">${esc(c.l)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => '<tr>' + cols.map(c => `<td class="${c.num ? 'n' : ''}">${esc(printCell(c, r))}</td>`).join('') + '</tr>').join('')}</tbody>
    ${totals ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.num ? 'n' : ''}">${i === 0 ? t('all') : totals[c.k] !== undefined ? money(totals[c.k]) : ''}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
}
function filtersText(el) {
  return $$('label.tool', el).map(l => {
    const lbl = (l.childNodes[0] && l.childNodes[0].textContent || '').trim();
    const sel = $('select', l), inp = $('input:not(.cb-input)', l);
    if (sel) return sel.value !== '' ? lbl + ': ' + sel.selectedOptions[0].textContent : '';
    if (inp && inp.type === 'checkbox') return inp.checked ? l.textContent.trim() : '';
    return inp && inp.value ? lbl + ': ' + inp.value : '';
  }).filter(Boolean).join(' · ');
}
function fullDocHtml(inner, orient) {
  return `<!doctype html><html dir="${document.documentElement.dir}"><head><meta charset="utf-8"><style>@page{size:A4 ${orient};margin:12mm 10mm}body{margin:0;background:#fff}${DOC_CSS}</style></head>
    <body><div class="doc ${orient}" dir="${document.documentElement.dir}">${inner}</div></body></html>`;
}

/** Fetches every filtered row for list pages (not just the visible page). */
async function fullExportData(limit) {
  const d = S.exportData;
  if (!d) return null;
  if (!d.fetchAll) return d;
  const rows = await d.fetchAll();
  return Object.assign({}, d, { rows: rows.slice(0, limit), capped: rows.length > limit ? limit : 0 });
}

let PRINT_JOB = null;
/** Opens the A4 orientation chooser, then prints whatever build(orientation) returns. */
function askPrint(build, def) {
  PRINT_JOB = build;
  const o = def || store.get('vms_orient') || 'portrait';
  openModal(`<div class="drawer-head"><h2>🖨 ${t('print')}</h2><button class="icon-button" data-act="closeModal">×</button></div>
    <p class="subtitle">${t('paperA4')} · ${t('orientation')}</p>
    <div class="orient">
      <button class="orient-btn ${o === 'portrait' ? 'active' : ''}" data-act="printGo" data-o="portrait"><i class="sheet p"></i>${t('portrait')}</button>

    </div>`);
}
async function printGo(orient) {
  store.set('vms_orient', orient);
  closeModal();
  const html = await PRINT_JOB(orient);
  if (!html) return;
  const area = $('#printArea');
  area.innerHTML = `<div class="doc ${orient}" dir="${document.documentElement.dir}">${html}</div>`;
  $('#pageStyle').textContent = `@page { size: A4 ${orient}; margin: 12mm 10mm; }`;
  const clean = () => { area.innerHTML = ''; window.removeEventListener('afterprint', clean); };
  window.addEventListener('afterprint', clean);
  setTimeout(() => window.print(), 60);
}

async function loadAlloc(account) {

  box.innerHTML = `<div class="skeleton">${t('loading')}</div>`;

    : `<div class="empty">${t('noOpenInvoices')}</div><label class="field">${t('onAccount')} (${esc(lc)})<input name="onAccount" type="text" inputmode="decimal" data-num></label>`;
  if (ed) { // put back the amounts this payment voucher already pays
    const left = {};
    ed.allocations.forEach(a => { left[a.invoiceVoucher] = (left[a.invoiceVoucher] || 0) + a.amount; });
    $$('[data-aamt]', box).forEach(el => {
      const inv = S.rcOpen[+el.dataset.aamt], v = Math.min(left[inv.voucher] || 0, inv.remaining);

      const total = (+ed.tx.debitMST || 0) - (+ed.tx.creditMST || 0) - ed.allocations.reduce((s, a) => s + a.amount, 0);

function rcSum() {
  let s = 0;
  $$('[data-aamt]').forEach(el => {
    const i = +el.dataset.aamt, v = parseNum(el.value);
    el.classList.toggle('over', v > S.rcOpen[i].remaining + 0.005);
    $(`[data-ai="${i}"]`).checked = v > 0;
    s += v;
  });
  const el = $('#rcSum'); if (el) el.textContent = money(s);

function rcDistribute(total) {
  let left = total;
  $$('[data-aamt]').forEach(el => {
    const rem = S.rcOpen[+el.dataset.aamt].remaining;
    const a = Math.max(0, Math.min(left, rem));
    el.value = a ? groupDigits(String(Math.round(a * 100) / 100)) : '';
    left -= a;
  });
  rcSum();
}

// ───────── Statement sending ─────────
function normPhone(p) {
  let d = String(p || '').replace(/[^\d+]/g, '');
  if (d.charAt(0) === '+') return d.slice(1);
  if (d.indexOf('00') === 0) return d.slice(2);
  const cc = String(docSettings().WhatsAppCountryCode || S.settings.WhatsAppCountryCode || '').replace(/\D/g, '');
  if (cc && (d.charAt(0) === '0' || d.length <= 9) && d.indexOf(cc) !== 0) d = cc + d.replace(/^0+/, '');
  return d;
}
function stmtMessage(r, link) {
  const c = r.customer || {}, cc = r.currency, st = r.settings || docSettings();
  const overdue = ['b1', 'b2', 'b3', 'b4'].reduce((s, k) => s + (r.aging[k] || 0), 0);
  const lines = [t('msgDear', { n: c.name }), t('msgGreeting'), '', t('msgBalance', { d: r.to, a: money(r.closing) + ' ' + cc })];
  if (overdue > 0) lines.push(t('msgOverdue', { a: money(overdue) + ' ' + cc }));
  if (r.openInvoices.length) {
    lines.push('', t('msgOpen'));
    r.openInvoices.slice(0, 12).forEach(i => lines.push('• ' + i.voucher + ' — ' + i.date + ' — ' + money(i.remaining) + (i.days ? ' (' + i.days + ' ' + t('day') + ')' : '')));
  }
  if (link) lines.push('', t('msgLink', { u: link }));
  if (st.BankDetails) lines.push('', t('BankDetails') + ':', st.BankDetails);
  lines.push('', t('msgThanks'), st.CompanyName || '');
  return lines.join('\n');
}
const stmtFileName = r => 'Vendor_Statement_' + (r.customer || {}).account + '_' + r.to;

async function sendWhatsApp(form) {

  const phone = normPhone(E.phone.value);

  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try {

      const l = await call('statementPdfLink', r.customer.account, { html: fullDocHtml(statementDoc(r), 'portrait'), fileName: stmtFileName(r) });

      const thanks = msg.lastIndexOf('\n\n' + t('msgThanks'));
      const add = '\n\n' + t('msgLink', { u: l.url });
      msg = thanks > -1 ? msg.slice(0, thanks) + add + msg.slice(thanks) : msg + add;
    }
    const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
    call('logContact', r.customer.account, 'WhatsApp', 'Statement sent via WhatsApp to ' + phone).catch(() => {});
    $('#waGo').innerHTML = `<a class="button-primary link-btn wa-btn" href="${esc(url)}" target="_blank" rel="noopener" data-act="closeModalSoon">💬 ${t('openWhatsApp')} (+${esc(phone)})</a>`;
    try { window.open(url, '_blank'); } catch (e) {}
  } finally { b.disabled = false; }
}

function startPolling() {

}
async function pollUnread() {
  if (!S.token) return;
  try {
    const r = await run('getUnreadCount', S.token);
    setBadge('messages', r.messages + r.alerts);
    if (S.lastUnread !== null && r.messages > S.lastUnread) {
      toast(t('newMsgToast', { n: r.messages }));
      if (S.view === 'messages' && !$('#overlay').classList.contains('open')) VIEWS.messages();
    }
    S.lastUnread = r.messages;
  } catch (e) {
    if (/SESSION_EXPIRED/.test(String(e && e.message || e))) { signOutLocal(); toast(t('err_SESSION_EXPIRED'), 'error'); }
  }
}
const msgTitle = m => I18N.en[m.subject] ? t(m.subject) : (m.subject || '—');
const msgFrom = m => m.from === 'system' ? t('system') : m.fromName;
const msgTo = m => m.to === 'ALL' ? t('allUsers') : (m.toName || m.to);

function composeForm(account) {
  const others = (S.lookups.users || []).filter(u => u.username !== S.user.username);
  openDrawer(`<div class="drawer-head"><h2>✉ ${t('compose')}</h2><button class="icon-button" data-act="closeDrawer">×</button></div>
    <form class="form-panel" id="msgForm" style="padding:16px 0 0">
      <div class="field">${t('msgTo')} <span class="req">*</span><div class="check-grid">
        <label class="check"><input type="checkbox" name="to" value="ALL"><b>${t('allUsers')}</b></label>
        ${others.map(u => `<label class="check"><input type="checkbox" name="to" value="${esc(u.username)}">${bdi(u.name)}</label>`).join('')}</div></div>
      <label class="field">${t('relatedCustomer')}<select name="account"><option value=""></option>${opts(customerOpts(), account || '')}</select></label>
      <label class="field">${t('msgSubject')}<input name="subject" maxlength="200"></label>
      <label class="field">${t('msgBody')} <span class="req">*</span><textarea name="body" required maxlength="5000" style="min-height:160px"></textarea></label>
      <div class="form-actions"><button type="button" class="button-ghost" data-act="closeDrawer">${t('cancel')}</button><button class="button-primary" type="submit">${t('sendMsg')}</button></div>

}
async function submitMessage(form) {
  const to = $$('input[name=to]:checked', form).map(i => i.value);
  if (!to.length) { toast(t('pickRecipient'), 'error'); return; }
  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try {
    await call('sendMessage', { to: to, subject: form.elements.subject.value, body: form.elements.body.value, account: form.elements.account.value });
    toast(t('msgSent')); closeDrawer();
    if (S.view === 'messages') { S.msgBox = 'sent'; VIEWS.messages(); }
  } catch (e) { b.disabled = false; }
}
async function openThread(id) {
  openDrawer(`<div class="skeleton">${t('loading')}</div>`, true);
  const r = await call('getThread', id);
  const first = r.thread[0] || {};
  openDrawer(`<div class="drawer-head"><div><h2>${esc(msgTitle(first))}</h2>
      ${first.account ? `<p style="margin:4px 0 0">${t('relatedCustomer')}: <button class="section-action" data-act="openCust" data-acc="${esc(first.account)}">${esc(first.account)} — ${bdi(r.customerName)}</button></p>` : ''}</div>
      <div style="display:flex;gap:8px"><button class="icon-button" data-act="msgDelete" data-id="${esc(id)}" title="${t('del')}">🗑</button>
      <button class="icon-button" data-act="closeDrawer">×</button></div></div>
    <div class="thread">${r.thread.map(m => `<div class="bubble ${m.mine ? 'mine' : ''} ${m.type === 'notification' ? 'sys' : ''}">
      <div class="bubble-head"><b>${bdi(m.from === 'system' ? t('system') : m.fromName)}</b><span>${esc(m.createdAt)}</span></div>
      <div class="bubble-body">${esc(m.body)}</div></div>`).join('')}</div>
    ${first.type !== 'notification' ? `<form id="replyForm" class="form-panel" data-root="${esc(r.root)}" style="padding:14px 0 0">
      <textarea name="body" required maxlength="5000" placeholder="${t('writeReply')}" style="min-height:90px;width:100%;border:1px solid var(--border);border-radius:6px;padding:9px;background:var(--page);color:var(--text)"></textarea>
      <div class="form-actions"><button class="button-primary" type="submit">↩ ${t('reply')}</button></div></form>` : ''}`, true);
  pollUnread();
}
async function submitReply(form) {
  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try {
    await call('sendMessage', { replyTo: form.dataset.root, body: form.elements.body.value });
    toast(t('msgSent'));
    openThread(form.dataset.root);
  } catch (e) { b.disabled = false; }
}

    openModal(`<div class="drawer-head"><h2>🔑 ${t('changePw')}</h2><button class="icon-button" data-act="closeModal">×</button></div>

        <label class="field">${t('curPw')} <span class="req">*</span><input name="cur" type="password" autocomplete="current-password" required></label>
        <label class="field">${t('newPw')} <span class="req">*</span><input name="next" type="password" autocomplete="new-password" minlength="6" required></label>

  },

  async rowUnpost(el) { const { view, row } = rowOf(el); const n = await call('postTransactions', [row.rowId], true, S.view); toast(t('unpostedN', { n })); loadList(view); },

    if (!ids.length) { toast(t('selectDraft'), 'error'); return; }

  },

      { k: 'invoiced', l: t('invoicedPeriod'), num: true }, { k: 'due', l: t('totalDue'), num: true }, { k: 'collected', l: t('collectedAmt'), num: true },
      { k: 'remaining', l: t('remainingAmt'), num: true }, { k: 'rate', l: t('collectRate'), f: v => NI.format(v) + '%', p: x => x.rate + '%', x: x => x.rate / 100 },
      { k: 'overdue', l: t('overdueAmt'), num: true }, { k: 'maxDays', l: t('maxDays'), f: v => v ? daysPill(v) : '' }];
    S.exportData = { name: 'performance_' + (m.collector || 'unassigned'), title: t('p_performance') + ' — ' + (m.name || t('unassigned')), cols, rows: m.list };
    openDrawer(`<div class="drawer-head"><h2>${bdi(m.name || t('unassigned'))} — ${t('companies')} (${NI.format(m.companies)})</h2>
      <div style="display:flex;gap:8px">${exportBtn()}${btn('print', '🖨', 'button-ghost')}<button class="icon-button" data-act="closeDrawer">×</button></div></div>
      <div class="panel flush">${table('perfDrawer', cols, m.list, { click: true, sortable: false })}</div>`, true);
  },

    const m = S.rows.collectors[+el.dataset.i];
    const cols = [{ k: 'account', l: t('f_account') }, { k: 'name', l: t('f_name') }, { k: 'balance', l: t('balance'), num: true },
      { k: 'remaining', l: t('overdueAmt'), num: true }, { k: 'count', l: t('invoices'), num: true, f: v => NI.format(v) }, { k: 'maxDays', l: t('maxDays'), f: daysPill }, { k: 'lastFollowUp', l: t('lastFollowUp') }];
    S.exportData = { name: 'manager_' + (m.collector || 'unassigned'), cols, rows: m.companies };
    openDrawer(`<div class="drawer-head"><h2>${bdi(m.name || t('unassigned'))} — ${t('companies')}</h2><div style="display:flex;gap:8px">${exportBtn()}<button class="icon-button" data-act="closeDrawer">×</button></div></div>
      <div class="panel flush">${table('collDrawer', cols, m.companies, { click: true, sortable: false })}</div>`, true);

    const entity = $('#impEntity').value;
    call('getTemplateHeaders', entity).then(h => {
      S.exportData = { name: entity + '_template', cols: h.map(x => ({ k: x, l: x })), rows: [{}] };
      exportXlsx();
    });

  impRun: runImport,
  async cleanDup() {
    if (!confirm(t('cleanDup') + '?')) return;
    const r = await call('removeDuplicateCustomers');

function rowOf(el) {
  const tbl = el.closest('table'), tr = el.closest('tr');
  const view = tbl.dataset.view;
  return { view, row: S.rows[view][+tr.dataset.i] };
}

// Rows that open the vendor 360 drawer when clicked.
const ROW_CUSTOMER_VIEWS = ['collectionsDet', 'perfDrawer', 'receipts', 'customers', 'dashTop', 'balances', 'paid', 'overdue', 'overdueCust', 'credit', 'collFlat', 'collDrawer'];

document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }
  const actEl = e.target.closest('[data-act]');
  if (actEl && ACT[actEl.dataset.act]) { e.preventDefault(); ACT[actEl.dataset.act](actEl, e); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const view = th.closest('table').dataset.view, s = listState(view);
    s.desc = s.sort === th.dataset.sort ? !s.desc : false; s.sort = th.dataset.sort; loadList(view); return;
  }
  const mi = e.target.closest('.msg-item[data-mi]');
  if (mi) {
    const m = S.msgRows[+mi.dataset.mi];
    if (m.type === 'alert') openCustomer(m.account); else { mi.classList.remove('unread'); openThread(m.id); }
    return;
  }
  if (e.target.closest('input,label,a,button,select,.cb')) return;
  const tr = e.target.closest('tbody tr[data-i]');
  if (tr) {
    const view = tr.closest('table').dataset.view;
    const row = (S.rows[view] || [])[+tr.dataset.i];
    if (row && view === 'purchases') openPurchase(row.invNo);
    else if (row && ROW_CUSTOMER_VIEWS.indexOf(view) > -1) openCustomer(row.account);
  }
  if (e.target.id === 'overlay') closeDrawer();
  if (e.target.id === 'modal') closeModal();
});

let searchTimer;
document.addEventListener('input', e => {
  if (e.target.matches('input[data-num]')) {
    formatNumInput(e.target);
    if (e.target.id === 'rcTotal') rcDistribute(parseNum(e.target.value));
    else if (e.target.dataset.aamt !== undefined) rcSum();
    if (e.target.closest('#piForm')) piCalc();
    if (FORM && FORM.entity === 'Transactions' && e.target.form && e.target.form.id === 'recForm') txFormCalc(e.target.form, e.target.name);
    return;
  }
  const tools = e.target.closest('[data-list]');
  if (tools && e.target.type === 'search') {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => onListTools(tools.dataset.list, tools), 400);
  }
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('cb-input') || e.target.matches('input[data-num]')) return;
  if (e.target.form && e.target.form.id === 'recForm' && FORM && FORM.entity === 'Transactions' && e.target.name === 'currency') { txFormCalc(e.target.form, 'currency'); return; }
  if (e.target.form && e.target.form.id === 'recForm' && FORM && FORM.entity === 'Currencies' && e.target.name === 'code') {
    const h = $('[data-hint="rate"]'); if (h) h.textContent = t('rateOf', { c: e.target.value.toUpperCase(), b: baseCur() }); return;
  }
  if (e.target.matches('input[data-perm]')) {
    const tr = e.target.closest('tr');
    if (e.target.dataset.perm === 'view' && !e.target.checked) $$('input[data-perm]', tr).forEach(i => { i.checked = false; });
    if (e.target.dataset.perm !== 'view' && e.target.checked) $('[data-perm=view]', tr).checked = true;
    return;
  }
  if (e.target.matches('input[data-permcol]')) {
    const c = e.target.dataset.permcol, on = e.target.checked;
    $$(`table.perm input[data-perm="${c}"]`).forEach(i => { i.checked = on; i.dispatchEvent(new Event('change', { bubbles: true })); });
    return;
  }
  if (e.target.form && e.target.form.id === 'piForm') {
    if (e.target.name === 'account') e.target.form.elements.vendorName.value = custName(e.target.value);
    else if (e.target.name === 'itemId') { // item → its card cost
      const it = (S.lookups.items || []).find(x => x.id === e.target.value), tr = e.target.closest('tr');
      if (it && tr) { $('[name=cost]', tr).value = fmtInputNum(it.cost); if (!parseNum($('[name=quantity]', tr).value)) $('[name=quantity]', tr).value = '1'; }
      piCalc();
    }
    return;
  }
  if (e.target.form && e.target.form.id === 'rcForm') {
    const n = e.target.name;
    if (n === 'account') loadAlloc(e.target.value);
    else if (n === 'payMethod') rcMethod();
    else if (n === 'currency') {
      const r = rateOf(e.target.value), l = rateOf(localCur());
      if (r && l) e.target.form.elements.exchange.value = groupDigits(String(+(r / l).toFixed(6)));
    } else if (e.target.dataset.ai !== undefined) {
      const i = e.target.dataset.ai, amt = $(`[data-aamt="${i}"]`);
      amt.value = e.target.checked ? groupDigits(String(S.rcOpen[+i].remaining)) : '';
      rcSum();
    }
    return;
  }
  if (S.view === 'statement' && e.target.dataset.f === 'account' && e.target.closest('#repTools')) { runReport(); return; }
  if (e.target.closest('#dashTools')) { S.rep.dashboard.currency = e.target.value; VIEWS.dashboard(); return; }
  const tools = e.target.closest('[data-list]');
  if (tools && e.target.type !== 'search') { onListTools(tools.dataset.list, tools); return; }
  if (e.target.matches('[data-pagesize]')) {
    const v = e.target.closest('.pager').dataset.view, s = listState(v);
    s.pageSize = +e.target.value; s.page = 1; loadList(v); return;
  }
  if (e.target.id === 'impFile' && e.target.files[0]) readImportFile(e.target.files[0]);
  if (e.target.id === 'impEntity') renderImportPreview();
  if (e.target.id === 'impMode') impOptions();
  if (e.target.id === 'logoFile' && e.target.files[0]) logoDataUrl(e.target.files[0]).then(saveLogo).catch(() => toast(t('err_LOGO_INVALID'), 'error'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else closeDrawer(); }
  if (e.key === 'Enter' && e.target.id === 'gsearch') {
    const s = listState('customers'); s.q = e.target.value.trim(); s.page = 1; go('customers');
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') doLogin(e.target);
  else if (e.target.id === 'recForm') submitForm(e.target);
  else if (e.target.id === 'rcForm') submitReceipt(e.target);
  else if (e.target.id === 'piForm') submitPurchase(e.target);
  else if (e.target.id === 'msgForm') submitMessage(e.target);
  else if (e.target.id === 'pwForm') {
    const E = e.target.elements;
    if (E.next.value !== E.again.value) { toast(t('pwMismatch'), 'error'); return; }
    if (E.next.value.length < 6) { toast(t('err_PASSWORD_SHORT'), 'error'); return; }
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true;
    try { await call('changePassword', E.cur.value, E.next.value); closeModal(); toast(t('pwChanged')); } catch (err) { b.disabled = false; }
  }
  else if (e.target.id === 'replyForm') submitReply(e.target);
  else if (e.target.id === 'mailForm') sendEmail(e.target);
  else if (e.target.id === 'waForm') sendWhatsApp(e.target);
  else if (e.target.id === 'settingsForm') {
    const fd = {}; SETTING_INPUTS.concat(SETTING_TEXTS).forEach(k => { fd[k] = e.target.elements[k].value.trim(); });
    S.settings = await call('saveSettings', fd); toast(t('settingsSaved')); renderShell(); go('users');
  } else if (e.target.id === 'curSettings') {
    const E = e.target.elements;
    S.settings = await call('saveCurrencySettings', { ReportCurrency: E.ReportCurrency.value, LocalCurrency: E.LocalCurrency.value, ConversionBasis: E.ConversionBasis.value });
    await refreshLookups();
    toast(t('settingsSaved')); go('currencies');
  }
});

// ───────── Boot ─────────
(async function boot() {
  applyPrefs();
  const css = document.createElement('style'); css.textContent = DOC_CSS; document.head.appendChild(css);
  const page = document.createElement('style'); page.id = 'pageStyle'; document.head.appendChild(page);
  checkVersion();
  store.set('vms_token', null); // drop tokens saved by older versions
  const tok = sess.get('vms_token');
  if (tok) {
    try { setLoading(1); onLogin(await run('resume', tok)); return; }
    catch (e) { sess.set('vms_token', null); }
    finally { setLoading(-1); }
  }
  renderLogin();
})();
