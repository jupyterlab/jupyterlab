name: Check Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:

  check_release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_GLOBAL_CACHE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2

      - name: Check Release
        uses: jupyter-server/jupyter_releaser/.github/actions/check-release@0bdca04f31abd7dfa75f8f8d33c52620ed3c8357 # v1.11.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version_spec: next

      # The staging build installs @jupyterlab packages from a local Verdaccio
      # registry. Keep them out of the saved cache, or a later run reuses them.
      - name: Remove Verdaccio packages from the yarn cache
        if: always()
        run: rm -f ~/.yarn/berry/cache/@jupyterlab-*

      - name: Upload Assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jupyterlab-releaser-dist-${{ github.run_number }}
          path: |
            .jupyter_releaser_checkout/dist/*.*
