name: Create snapshot update PR

on:
  # act on comments on PR
  issue_comment:
    types: [created, edited]
  # act on review body (the "main" review comment)
  pull_request_review:
    types: [submitted, edited]
  # act on individual review comments
  pull_request_review_comment:
    types: [created, edited]

# Disable permissions for all of the available permissions.
permissions: {}

# Repeated requests on one pull request replace the run in flight. Each pull
# request is its own group, so this is a per-PR limit and not a repository-wide one.
concurrency:
  group: galata-update-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  start-work:
    name: Start work
    if: >
      (
        github.event.issue.pull_request ||
        (
          github.event.pull_request &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      ) &&
      (
        contains(github.event.comment.body || github.event.review.body || '', 'would you be so kind as to update galata snapshots please') ||
        contains(github.event.comment.body || github.event.review.body || '', 'would you be so kind as to update example snapshots please') ||
        contains(github.event.comment.body || github.event.review.body || '', 'would you be so kind as to update examples snapshots please') ||
        contains(github.event.comment.body || github.event.review.body || '', 'would you be so kind as to update snapshots please') ||
        contains(github.event.comment.body || github.event.review.body || '', 'please open PR to update galata snapshots') ||
        contains(github.event.comment.body || github.event.review.body || '', 'please open PR to update example snapshots') ||
        contains(github.event.comment.body || github.event.review.body || '', 'please open PR to update examples snapshots') ||
        contains(github.event.comment.body || github.event.review.body || '', 'please open PR to update snapshots')
      )
    runs-on: ubuntu-slim
    environment: update-snapshots
    steps:
      - name: React positively to the triggering comment
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ secrets.BOT_USER_PAT }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            echo "Skipping reaction for review body; GitHub does not expose a comment reaction endpoint for it."
          elif [[ "$EVENT_NAME" == "pull_request_review_comment" ]]; then
            echo "Skipping reaction for review comment to avoid failing the workflow."
          else
            gh api "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" --raw-field 'content=+1'
          fi

  get-snapshot-updates:
    name: Fetch test assets once ready
    runs-on: ubuntu-24.04
    needs: [start-work]
    timeout-minutes: 20
    permissions:
      actions: read  # for querying the test-results artifact
      pull-requests: read  # for getting the PR info
    outputs:
      pr-head-ref: ${{ steps.get-pr-info.outputs.head-ref }}
      pr-head-repo: ${{ steps.get-pr-info.outputs.head-repo }}
      pr-head-sha: ${{ steps.get-pr-info.outputs.head-sha }}
      assets-run-id: ${{ steps.download.outputs.assets-run-id }}
    steps:
      - name: Get PR information
        id: get-pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PR_DATA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
          {
            echo "head-ref=$HEAD_REF"
            echo "head-repo=$HEAD_REPO"
            echo "head-sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for galata-test-assets-merged artifact
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.get-pr-info.outputs.head-sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT_NAME="galata-test-assets-merged"
          MAX_WAIT=1080  # 18 minutes, inside this job's 20 minute timeout
          ELAPSED=0

          echo "Waiting for artifact: $ARTIFACT_NAME from PR #$PR_NUMBER (head sha: $PR_HEAD_SHA)"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            echo "Checking for artifact... (elapsed: ${ELAPSED}s)"

            # Get recent workflow runs and try the most relevant candidates first.
            RUNS=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow galata.yml \
              --status completed \
              --json databaseId,event,headBranch,headSha,conclusion,createdAt \
              --limit 20)

            if [ -z "$RUNS" ] || [ "$RUNS" = "[]" ]; then
              echo "No completed galata.yml runs found yet"
            else
              echo "Recent galata.yml runs (up to 20):"
              echo "$RUNS" | jq -r '.[] | "  id=\(.databaseId) event=\(.event) branch=\(.headBranch) sha=\(.headSha) conclusion=\(.conclusion) created=\(.createdAt)"'

              RUN_IDS=$(echo "$RUNS" | jq -r --arg sha "$PR_HEAD_SHA" '[.[] | select(.headSha == $sha) | .databaseId] | .[]')
              if [ -z "$RUN_IDS" ]; then
                echo "No runs matched head sha '$PR_HEAD_SHA'"
              fi

              for RUN_ID in $RUN_IDS; do
                echo "Trying artifact download from run $RUN_ID"
                rm -rf ./artifact
                if gh run download "$RUN_ID" \
                  --repo "$REPOSITORY" \
                  --name "$ARTIFACT_NAME" \
                  --dir ./artifact 2>/dev/null; then
                  echo "Artifact downloaded successfully from run $RUN_ID"
                  echo "assets-run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              done
            fi

            # Wait before retrying
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "::error::Timeout waiting for artifact after ${MAX_WAIT}s"
          exit 1

  prepare-snapshots:
    name: Unpack and compress snapshots
    needs: [get-snapshot-updates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      has-changes: ${{ steps.collect.outputs.has-changes }}
      head-sha: ${{ steps.collect.outputs.head-sha }}
    permissions:
      actions: read  # for download of the test results
      contents: read # to fetch the pull request and unpack_snapshots.py
    env:
      # Everything this job handles was produced by the pull request: the
      # checkout, the downloaded report and the PNG files optipng parses. It is
      # kept apart from the bot token for that reason, and hands the next job a
      # checked list of snapshot files rather than the artifact itself.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          fetch-depth: 1
          path: repo
          persist-credentials: false

      - name: Download test results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_RUN_ID: ${{ needs.get-snapshot-updates.outputs.assets-run-id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "$ASSETS_RUN_ID" --repo "$REPOSITORY" --name galata-test-assets-merged --dir ./test-assets

      - name: List tests assets
        run: |
          find ./test-assets -type f -name "*.json" -o -name "*.png"

      - name: Get script for unpacking screenshots
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # we fetch it from main to avoid running code from forks
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: scripts/unpack_snapshots.py
          sparse-checkout-cone-mode: false
          path: tools
          persist-credentials: false

      - name: Process JSON reports and unpack snapshots
        run: |
          python ../tools/scripts/unpack_snapshots.py ../test-assets
        working-directory: repo

      - name: Compress snapshots
        shell: bash -l {0}
        run: |
          set -ex
          sudo apt install optipng
          # Apply compression only on new and modified versioned files
          # - this does not filter out deleted files but it should not happen.
          echo "::group::Optimize PNG files"
          git ls-files --exclude-standard -om | grep -e "\.png$" | xargs optipng
          echo "::endgroup::"
        working-directory: repo

      - name: Collect the updated snapshots
        id: collect
        run: |
          set -eo pipefail

          # The next job checks out this exact commit, so both jobs see one tree.
          echo "head-sha=$(git -C repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git -C repo ls-files -z --exclude-standard -mo -- \
            ':(glob)galata/**/*.png' \
            ':(glob)galata/**/*.json' \
            ':(glob)examples/**/*-snapshots/*.png' \
            > snapshot-files

          mkdir -p updates
          COUNT=0
          while IFS= read -r -d '' FILE; do
            case "$FILE" in
              galata/*.png | galata/*.json | examples/*-snapshots/*.png) ;;
              *) echo "::error::Unexpected snapshot path: $FILE"; exit 1 ;;
            esac
            if [[ -L "repo/$FILE" ]]; then
              echo "::error::Refusing to collect a symbolic link: $FILE"
              exit 1
            fi
            mkdir -p "updates/$(dirname "$FILE")"
            cp -- "repo/$FILE" "updates/$FILE"
            COUNT=$((COUNT + 1))
          done < snapshot-files

          if [[ "$COUNT" -eq 0 ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Collected $COUNT updated snapshot(s)"
            find updates -type f | sort
          fi

      - name: Upload the updated snapshots
        if: steps.collect.outputs.has-changes == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: galata-snapshot-updates
          path: updates
          retention-days: 1

  create-branch:
    name: Replace snapshots
    needs: [prepare-snapshots]
    if: needs.prepare-snapshots.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: update-snapshots
    outputs:
      branch-name: ${{ steps.create-branch.outputs.branch-name }}
    permissions:
      contents: read # to fetch the pull request head
    env:
      # This job holds the bot token, so it only moves checked snapshot files
      # and runs Git. Nothing it runs parses data from the pull request.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null

    steps:
      # The artifact is unpacked before the checkout exists, so an archive entry
      # reaching outside of its directory has nothing here to overwrite.
      - name: Download the updated snapshots
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: galata-snapshot-updates
          path: updates

      - name: Check that the archive stayed in its directory
        run: |
          UNEXPECTED=$(find . -mindepth 1 -maxdepth 1 ! -name updates -printf '%f\n')
          if [[ -n "$UNEXPECTED" ]]; then
            echo "::error::The snapshot archive wrote outside of its directory: $UNEXPECTED"
            exit 1
          fi

      - name: Configure committer identity
        run: |
          git config --global user.name 'galata-snapshots-bot'
          git config --global user.email '263663552+galata-snapshots-bot@users.noreply.github.com'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The commit the previous job unpacked against, so the snapshots are
          # staged on the tree they were compared with.
          ref: ${{ needs.prepare-snapshots.outputs.head-sha }}
          fetch-depth: 1
          path: repo
          persist-credentials: false

      - name: Apply the updated snapshots
        run: |
          set -eo pipefail
          CHECKOUT=$(realpath repo)

          find updates -type f -print0 | while IFS= read -r -d '' PATH_IN_ARTIFACT; do
            FILE="${PATH_IN_ARTIFACT#updates/}"
            case "$FILE" in
              galata/*.png | galata/*.json | examples/*-snapshots/*.png) ;;
              *) echo "::error::Refusing to apply $FILE"; exit 1 ;;
            esac
            # A symbolic link committed to the branch must not redirect the copy.
            case "$(realpath -m -- "$CHECKOUT/$FILE")" in
              "$CHECKOUT"/*) ;;
              *) echo "::error::Refusing to write outside the checkout: $FILE"; exit 1 ;;
            esac
            mkdir -p "$CHECKOUT/$(dirname "$FILE")"
            cp --remove-destination -- "$PATH_IN_ARTIFACT" "$CHECKOUT/$FILE"
          done

      - name: Create snapshot-update branch
        id: create-branch
        env:
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -ex
          BRANCH_NAME="snapshot-update/pr-${PR_NUMBER}"
          echo "branch-name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"

          git ls-files -z --exclude-standard -mo -- \
            ':(glob)galata/**/*.png' \
            ':(glob)galata/**/*.json' \
            ':(glob)examples/**/*-snapshots/*.png' \
            > /tmp/snapshot-files

          if [[ -s /tmp/snapshot-files ]]; then
            git add --pathspec-from-file=/tmp/snapshot-files --pathspec-file-nul
          fi

          if git diff --cached --name-only | grep -Ev '^(galata/.*\.(png|json)|examples/.*-snapshots/.*\.png)$' >/dev/null; then
            echo "::error::Only galata/*.png, galata/*.json, and examples/*-snapshots/*.png files are allowed in this update"
            git diff --cached --name-only
            exit 1
          fi

          git diff --cached --name-status
          # We do not want pre-commit to run in case if user code modifies it
          git commit -m "Update snapshots" --no-verify
        working-directory: repo

      - name: Ensure fork exists
        env:
          GH_TOKEN: ${{ secrets.BOT_USER_PAT }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh repo fork --default-branch-only
          git remote add bot "https://github.com/galata-snapshots-bot/${REPO_NAME}.git"
        working-directory: repo

      - name: Push to bot fork
        env:
          GH_TOKEN: ${{ secrets.BOT_USER_PAT }}
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch-name }}
        run: |
          gh auth setup-git
          git push bot "$BRANCH_NAME" --force
        working-directory: repo

  open-pr:
    name: Open a new PR with updates
    runs-on: ubuntu-slim
    needs: [get-snapshot-updates, create-branch]
    if: needs.create-branch.result == 'success'
    environment: update-snapshots
    outputs:
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
      pr-action: ${{ steps.open-pr.outputs.pr-action }}
    steps:
      - name: Open Pull Request
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.BOT_USER_PAT }}
          BASE_REF: ${{ needs.get-snapshot-updates.outputs.pr-head-ref }}
          TARGET_REPO: ${{ needs.get-snapshot-updates.outputs.pr-head-repo }}
          HEAD_REF: ${{ needs.create-branch.outputs.branch-name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ASSETS_SHA: ${{ needs.get-snapshot-updates.outputs.pr-head-sha }}
        run: |
          set -ex

          # Create PR title and body
          PR_TITLE="Update galata snapshots for PR #${PR_NUMBER}"
          PR_BODY=$(cat <<EOF
          ## Updates galata snapshots

          This PR updates the galata test snapshots based on the test results from #${PR_NUMBER}.

          **Source PR**: #${PR_NUMBER}
          **Base branch**: ${BASE_REF}
          **Snapshots taken from**: ${ASSETS_SHA}
          EOF
          )

          # Reuse an existing matching PR when present, otherwise create one.
          EXISTING_PR_URL=$(gh api "repos/$TARGET_REPO/pulls" \
            --method GET \
            --raw-field "state=open" \
            --raw-field "head=galata-snapshots-bot:$HEAD_REF" \
            --raw-field "base=$BASE_REF" \
            --jq '.[0].html_url // ""')

          if [ -n "$EXISTING_PR_URL" ]; then
            PR_URL="$EXISTING_PR_URL"
            PR_ACTION="updated"
          else
            PR_URL=$(gh api "repos/$TARGET_REPO/pulls" \
              --method POST \
              --raw-field "title=$PR_TITLE" \
              --raw-field "body=$PR_BODY" \
              --raw-field "head=galata-snapshots-bot:$HEAD_REF" \
              --raw-field "base=$BASE_REF" \
              --jq '.html_url')
            PR_ACTION="created"
          fi

          {
            echo "pr-url=$PR_URL"
            echo "pr-action=$PR_ACTION"
          } >> "$GITHUB_OUTPUT"
          echo "Snapshot PR $PR_ACTION: $PR_URL"

  comment-back:
    name: Comment back on the PR
    runs-on: ubuntu-slim
    needs: [start-work, get-snapshot-updates, prepare-snapshots, open-pr, create-branch]
    if: needs.start-work.result == 'success' && always()
    environment: update-snapshots
    steps:
      - name: Compose comment message
        id: compose-message
        env:
          SNAPSHOT_PR_URL: ${{ needs.open-pr.outputs.pr-url }}
          SNAPSHOT_PR_ACTION: ${{ needs.open-pr.outputs.pr-action }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ASSETS_RUN_ID: ${{ needs.get-snapshot-updates.outputs.assets-run-id }}
          ASSETS_RESULT: ${{ needs.get-snapshot-updates.result }}
          PREPARE_RESULT: ${{ needs.prepare-snapshots.result }}
          HAS_CHANGES: ${{ needs.prepare-snapshots.outputs.has-changes }}
          CREATE_BRANCH_RESULT: ${{ needs.create-branch.result }}
          OPEN_PR_RESULT: ${{ needs.open-pr.result }}
        run: |
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          ASSETS_RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${ASSETS_RUN_ID}"

          if [ "$ASSETS_RESULT" != "success" ]; then
            BODY="I did not find test assets for this pull request. Are the UI tests done? [Workflow run](${RUN_URL})"
          elif [ "$PREPARE_RESULT" != "success" ]; then
            BODY="I failed to update snapshots while unpacking the test assets. [Workflow run](${RUN_URL})"
          elif [ "$HAS_CHANGES" = "false" ]; then
            BODY="I did not detect any snapshot changes. [Workflow run](${RUN_URL})"
          elif [ "$CREATE_BRANCH_RESULT" != "success" ]; then
            BODY="I failed to update snapshots while preparing/pushing the update branch. [Workflow run](${RUN_URL})"
          elif [ "$OPEN_PR_RESULT" != "success" ]; then
            BODY="I prepared snapshot changes, but opening the snapshot update PR failed. [Workflow run](${RUN_URL})"
          elif [ "$SNAPSHOT_PR_ACTION" = "updated" ]; then
            BODY="I updated the PR ${SNAPSHOT_PR_URL} with the latest snapshots from [run ${ASSETS_RUN_ID}](${ASSETS_RUN_URL})."
          else
            BODY="I created the PR ${SNAPSHOT_PR_URL} with snapshots from [run ${ASSETS_RUN_ID}](${ASSETS_RUN_URL})."
          fi

          echo "body=$BODY" >> "$GITHUB_OUTPUT"

      - name: Comment back on the PR
        env:
          GH_TOKEN: ${{ secrets.BOT_USER_PAT }}
          COMMENT_BODY: ${{ steps.compose-message.outputs.body }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --raw-field "body=$COMMENT_BODY"
