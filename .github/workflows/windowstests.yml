name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windowstests:
    name: Windows
    strategy:
      matrix:
        python-version: ["3.14"]
        group: [integrity, python]
        include:
          - group: integrity
            optional_dependencies: dev
          - group: python
            optional_dependencies: test
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # File operations on C: are several times slower than on D:
      - name: Move temporary files and package caches to the D drive
        shell: pwsh
        run: |
          $tmp = Join-Path $Env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          "TEMP=$tmp" >> $Env:GITHUB_ENV
          "TMP=$tmp" >> $Env:GITHUB_ENV
          "YARN_GLOBAL_FOLDER=$(Join-Path $Env:RUNNER_TEMP yarn-berry)" >> $Env:GITHUB_ENV
          # base-setup caches the folder that `yarn config get cacheFolder` reports,
          # which is the global cache only when this is set before base-setup runs
          "YARN_ENABLE_GLOBAL_CACHE=1" >> $Env:GITHUB_ENV
          "UV_CACHE_DIR=$(Join-Path $Env:RUNNER_TEMP uv-cache)" >> $Env:GITHUB_ENV

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@21b1cac622018fd37ec13a1c8081da814e10d94e # v1
        with:
          python_package_manager: "uv pip"
          python_cache_key_suffix: ${{ matrix.optional_dependencies }}

      - name: Install dependencies
        env:
          GROUP: ${{ matrix.group }}
          OPTIONAL_DEPENDENCIES: ${{ matrix.optional_dependencies }}
        run: .\scripts\ci_install
        shell: pwsh

      - name: Run test ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: .\scripts\ci_script
        shell: pwsh
