name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windowstests:
    name: Windows
    strategy:
      matrix:
        python-version: ["3.14"]
        group: [integrity, python]
        include:
          - group: integrity
            optional_dependencies: dev
          - group: python
            optional_dependencies: test
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@21b1cac622018fd37ec13a1c8081da814e10d94e # v1
        with:
          python_package_manager: "uv pip"
          python_cache_key_suffix: ${{ matrix.optional_dependencies }}

      - name: Install dependencies
        env:
          GROUP: ${{ matrix.group }}
          OPTIONAL_DEPENDENCIES: ${{ matrix.optional_dependencies }}
        run: .\scripts\ci_install
        shell: pwsh

      - name: Run test ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: .\scripts\ci_script
        shell: pwsh
