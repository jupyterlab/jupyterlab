name: Documentation Spell Check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/source/conf.py'
      - 'docs/source/_ext/**'
      - 'docs/source/spelling_wordlist.txt'
      - 'pyproject.toml'
      - 'scripts/check_spelling.py'
      - 'scripts/tests/test_check_spelling.py'
      - '.github/workflows/spell-check.yml'

permissions:
  contents: read

jobs:
  sphinx-spelling:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install system dependencies for enchant
        run: |
          sudo apt-get update
          sudo apt-get install -y libenchant-2-2 aspell aspell-en

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs pyenchant

      - name: Test spelling script
        run: python -m pytest --confcutdir=scripts/tests scripts/tests/test_check_spelling.py

      - name: Run Sphinx spelling builder
        run: |
          python scripts/check_spelling.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD
